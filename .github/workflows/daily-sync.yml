# Daily backstop bank sync for the Render free setup (Render cron jobs cost
# money; GitHub Actions is free for this). It calls POST /api/cron/sync.
#
# To turn it on, add two repository secrets (GitHub → Settings → Secrets and
# variables → Actions → New repository secret):
#   APP_URL      e.g. https://yts-books.onrender.com
#   CRON_SECRET  copy from Render → yts-books → Environment
# Without them the job does nothing (and does not fail).
name: Daily bank sync
on:
  schedule:
    - cron: '17 10 * * *' # every day 10:17 UTC (early morning US)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Call the sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not set; skipping."
            exit 0
          fi
          # The free web service may be asleep; wake it first.
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 "$APP_URL/api/health" > /dev/null || true
          node scripts/cron-sync.mjs
