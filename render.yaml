# Render Blueprint for Your Tax Solution Books (see DEPLOY.md).
# Plan names change over time — check them in the Render dashboard when you
# apply this file, and pick a Postgres plan that includes backups.
services:
  - type: web
    name: yts-books
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yts-books-db
          property: connectionString
      - key: ENCRYPTION_KEY # generated by Render — COPY IT INTO YOUR PASSWORD MANAGER (backups are useless without it)
        generateValue: true
      - key: SETUP_CODE # one-time code for the /setup page that creates your owner account
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL # e.g. https://books.yourtaxsolution.com
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV # sandbox until Plaid approves production
        value: sandbox
      - key: PLAID_WEBHOOK_URL # https://<your domain>/api/plaid/webhook
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: cron
    name: yts-books-daily-sync
    runtime: node
    schedule: "17 10 * * *" # every day 10:17 UTC (early morning US)
    buildCommand: echo "no build needed"
    startCommand: node scripts/cron-sync.mjs
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: yts-books
          envVarKey: CRON_SECRET

databases:
  - name: yts-books-db
    databaseName: books
    user: books
    postgresMajorVersion: "16"
