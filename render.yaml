# Render Blueprint for Your Tax Solution Books (see DEPLOY.md).
#
# FREE setup: free web service (sleeps after ~15 min idle, first visit then
# takes about a minute) and a free Postgres database. Render's free database
# EXPIRES after about 30 days and has NO backups — before real client data
# goes in, upgrade it in the dashboard (the data is kept when you upgrade).
# The daily backstop sync runs from GitHub Actions (.github/workflows/
# daily-sync.yml) because Render cron jobs are not free.
services:
  - type: web
    name: yts-books
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yts-books-db
          property: connectionString
      - key: ENCRYPTION_KEY # generated by Render — COPY IT INTO YOUR PASSWORD MANAGER (backups are useless without it)
        generateValue: true
      - key: SETUP_CODE # one-time code for the /setup page that creates your owner account
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL # e.g. https://books.yourtaxsolution.com
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV # sandbox until Plaid approves production
        value: sandbox
      - key: PLAID_WEBHOOK_URL # https://<your domain>/api/plaid/webhook
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: yts-books-db
    databaseName: books
    user: books
    plan: free
    postgresMajorVersion: "16"
